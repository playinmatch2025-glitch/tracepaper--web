// ENGINE. Optimizer: rewrites bytecode (4 tricks). Must never change a program's output. Pure JS, no DOM.
// Classic script (no modules): files share one global scope and load in the order listed in src/index.html.
function optimize(P){const notes=[],rep={fold:0,known:0,dead:0,copy:0},OPS={ADD:'+',SUBTRACT:'-',MULTIPLY:'x',DIVIDE:'/'},CMP={LESS:'<',GREATER:'>',EQUAL:'=='},defs={},sets={};
 const scanAll=f=>{f.code.forEach(c=>{if(c.op==='DEFINE_GLOBAL')defs[c.nm]=(defs[c.nm]||0)+1;if(c.op==='SET_GLOBAL')sets[c.nm]=1});f.K.forEach(k=>k&&k.code&&scanAll(k))};scanAll(P.f);
 const EF={CONSTANT:1,NIL:1,TRUE:1,FALSE:1,GET_LOCAL:1,GET_GLOBAL:1,GET_UPVALUE:1,CLOSURE:1,POP:-1,CLOSE_UPVALUE:-1,DEFINE_GLOBAL:-1,ADD:-1,SUBTRACT:-1,MULTIPLY:-1,DIVIDE:-1,EQUAL:-1,GREATER:-1,LESS:-1,PRINT:-1};

  const cut=(i,n,ins)=>{const d=n-ins.length;code.splice(i,n,...ins);code.forEach(c=>{if(/JUMP|LOOP/.test(c.op)&&c.arg>i+n-1)c.arg-=d})};
  for(let ch=1;ch;){ch=0;const tg=new Set(),KN={};code.forEach(c=>{if(/JUMP|LOOP/.test(c.op))tg.add(c.arg)});
   const free=(i,n)=>{for(let j=i+1;j<i+n;j++)if(tg.has(j))return false;return true};
   if(main)code.forEach((c,d)=>{if(c.op==='DEFINE_GLOBAL'&&d>0&&code[d-1].op==='CONSTANT'&&defs[c.nm]===1&&!sets[c.nm])KN[c.nm]={at:d,k:code[d-1].arg}});
   for(let i=0;i<code.length&&!ch;i++){const a=code[i],b=code[i+1],o=code[i+2],x=a.op==='CONSTANT'?K[a.arg]:undefined,y=b&&b.op==='CONSTANT'?K[b.arg]:undefined;

// CONTENT. The lessons: question, starter code, intro text, task, check, aha line. Add a lesson here.
// Classic script (no modules): files share one global scope and load in the order listed in src/index.html.
const CH=[
{n:'Adding numbers',q:'What does the computer do with 1 + 2?',p:'print 1 + 2;',v:'pile',lead:'The computer turns your line into small steps. It keeps values on a pile (called the stack). Press Run and watch.',task:'Change the code so it prints 14.',ok:r=>!r.err&&r.out.join()==='14',aha:'Every program is small steps like these: put values on the pile, work on them, show the answer.'},
{n:'Variables',q:'Where is a variable kept?',p:'var a = 10;\n{\n  var b = a * 2;\n  print b - 5;\n}\nprint a;',v:'mem',lead:'A variable is a box with a name. Boxes made inside { } are thrown away at the closing }.',task:'Add the line  print b;  at the end and run it. What do you see?',ok:r=>/"b"/.test(r.err||''),aha:'b was only inside the { }. After the }, it is gone. This is called scope.'},
{n:'Loops',q:'How does a program repeat?',p:'var sum = 0;\nfor (var i = 1; i <= 3; i = i + 1) {\n  sum = sum + i;\n}\nprint sum;',v:'flow',lead:'The computer reads line by line. A loop sends it back up to repeat some lines.',task:'Make it add the numbers 1 to 10. The answer is 55.',ok:r=>!r.err&&r.out.join()==='55',aha:'A loop just says "go back up". It stops when the condition becomes false.'},
{n:'Functions',q:'What happens when a function calls itself?',p:'fun fact(n) {\n  if (n <= 1) return 1;\n  return n * fact(n - 1);\n}\nprint fact(4);',v:'tower',lead:'Each call gets its own window with its own values. A function that calls itself opens window after window.',task:'Make it print the factorial of 5. The answer is 120.',ok:r=>!r.err&&r.out.join()==='120',aha:'Each call has its own n. The windows wait for each other. Then the answers come back one by one. This is the call stack.'},
{n:'Closures',q:'How can a function remember a value?',p:'fun makeCounter() {\n  var i = 0;\n  fun count() {\n    i = i + 1;\n    return i;\n  }\n  return count;\n}\nvar c = makeCounter();\nprint c();\nprint c();',v:'clos',lead:'A function inside another function can carry a bag of values from outside. The bag goes wherever the function goes.',task:'Add  var d = makeCounter();  and  print d();  at the end. Does d start at 1, or go on from 3?',ok:r=>!r.err&&r.out.join()==='1,2,1',aha:'Each makeCounter() call makes a new bag. So c and d count separately.'},
{n:'Classes',q:'How does an object get its methods?',p:'class Animal {\n  init(name) {\n    this.name = name;\n  }\n  speak() {\n    print this.name + " makes a sound";\n  }\n}\nvar a = Animal("Rex");\nvar b = Animal("Tom");\na.speak();\nb.speak();',v:'cls',lead:'A class is a blueprint. Each object made from it has its own values (called fields). All objects share the same methods.',task:'Add the line a.name = "Max"; before a.speak(); and run it. Which animal changed its name?',ok:r=>!r.err&&r.out.includes('Max makes a sound')&&r.out.includes('Tom makes a sound'),aha:'The class is made once. Each Animal(...) call makes a new object with its own fields. Changing a field of one object does not change the others.'},{n:'Memory',q:'Where do objects live while the program runs?',p:'var s = "";\nfor (var i = 0; i < 5; i = i + 1) {\n  s = s + "a";\n}\nprint s;',v:'heap',heap:{cells:32,gc:false},lead:'Numbers sit on the stack. Text and objects live in the heap. Each new string takes space there.',task:'Change 5 to 20 and run it. Watch the unused strings pile up. What happens when the heap is full?',ok:r=>/Out of memory/.test(r.err||''),aha:'Each s = s + "a" makes a new string and leaves the old one behind. Nothing frees the old ones, so unused strings pile up until the heap is full.'},
{n:'Mistakes',q:'What happens when there is a mistake?',p:'var x = 1;\nprint x + "a";',v:'err',lead:'Some mistakes are found before the program starts. Others are found only while it runs. Try both: delete the ; to see the first kind.',task:'Fix the code so it prints 2.',ok:r=>!r.err&&r.out.join()==='2',aha:'A missing ; is found before running. Adding a number and a text is found only while running.'},
{n:'Garbage collection',q:'How does the computer free memory nobody needs?',p:'var keep = "";\nvar s = "";\nfor (var i = 0; i < 20; i = i + 1) {\n  s = s + "a";\n  if (i == 2) {\n    keep = s;\n  }\n}\nprint s;\nprint keep;',v:'heap',heap:{cells:32,gc:true},lead:'This is lesson 7 with one change: the program keeps one old string in a variable called keep. A garbage collector now runs when the heap is full. It frees objects the program can no longer reach.',task:'Change i == 2 to i == 10 and run it. Which string does the collector keep now? Check the Held by lines.',ok:r=>!r.err&&r.gcs>0&&r.out[0]==='a'.repeat(20)&&r.out[1]==='a'.repeat(11),aha:'The collector does not care how old an object is. It keeps every object a variable can still reach, such as keep, and frees the rest.'},
{n:'Optimization',q:'Can the same work be done in fewer steps?',p:'var total = 0;\nfor (var i = 0; i < 60; i = i + 1) {\n  total = total + 2 * 3 * 4 + 5 * 6;\n}\nprint total;',v:'opt',lead:'This loop calculates 2 * 3 * 4 + 5 * 6 sixty times. The answer never changes. An optimizer calculates it once, before the program runs.',task:'Turn the optimizer on. Watch the steps go down.',ok:()=>!!(opt&&OP&&OP.r1.log.length<OP.r0.log.length&&OP.r1.out.join()===OP.r0.out.join()),aha:'Same answer, less work. Real compilers do this and much more.'},

const WHY={"CLASS": "Creates a new, empty class (a blueprint for objects) and puts it on the stack.", "METHOD": "Takes the function on top of the stack and adds it to the class below it, under the method name.", "INHERIT": "Copies all the methods of the superclass into the subclass. This is why the subclass can use them.", "GET_PROPERTY": "Reads a field of the object on top of the stack. If there is no such field, it looks for a method with that name.", "SET_PROPERTY": "Stores the top value in a field of the object below it. The value stays on the stack.", "INVOKE": "Calls a method by name in one step: it finds the method on the object and calls it.", "SUPER_INVOKE": "Calls a method of the superclass on this object.", "GET_SUPER": "Finds a method in the superclass and attaches it to this object.", "CONSTANT": "CONSTANT copies a fixed value from your code onto the stack. It waits there until an instruction needs it.", "NIL": "nil means \"no value\". The compiler adds NIL and RETURN at the end of every program or function, because it must give something back when it finishes.", "TRUE": "Puts the value true on the stack.", "FALSE": "Puts the value false on the stack.", "POP": "POP removes the top value of the stack. It cleans up a value that nobody needs any more.", "GET_LOCAL": "Copies a local variable from its place on the stack to the top. The compiler already knows the place, so no name lookup is needed.", "SET_LOCAL": "Writes the top value into a local variable. The value stays on the stack, because an assignment is also an expression.", "GET_GLOBAL": "Looks up a global variable by its name in a table and puts the value on the stack.", "SET_GLOBAL": "Changes a global variable that already exists. It is an error if the name was never defined.", "DEFINE_GLOBAL": "Takes the top value off the stack and stores it in the table of globals under the variable name.", "ADD": "ADD removes the top two values from the stack, adds them, and puts the result on top. Both values must already be on the stack, so the compiler emitted them first.", "SUBTRACT": "Removes the top two values and puts back the first minus the second. Order matters: the value pushed first is on the left.", "MULTIPLY": "Removes the top two values and puts back their product.", "DIVIDE": "Removes the top two values and puts back the first divided by the second.", "EQUAL": "Removes the top two values and puts back true if they are equal, otherwise false.", "GREATER": "Removes the top two values and puts back true if the first is bigger than the second.", "LESS": "Removes the top two values and puts back true if the first is smaller than the second.", "NOT": "Turns true into false and false into true. In Lox only false and nil count as false.", "NEGATE": "Changes the sign of the top value: 5 becomes -5.", "PRINT": "Removes the top value of the stack and shows it on the screen.", "JUMP_IF_FALSE": "Looks at the top value without removing it. If it is false, the program jumps ahead and skips the next part.", "JUMP": "Jumps ahead to another instruction and skips the code in between.", "LOOP": "Jumps backward to an earlier instruction. This is how a loop repeats.", "CLOSURE": "Creates a function value. If the function uses outside variables, they are put into its bag.", "CALL": "Calls the function that sits below its arguments on the stack. A new window opens for the call.", "RETURN": "Ends the current function or program. The result goes back to the caller and the window closes.", "GET_UPVALUE": "Reads an outside variable from the bag of the current function.", "SET_UPVALUE": "Changes an outside variable in the bag of the current function.", "CLOSE_UPVALUE": "The variable is about to leave the stack. Its value is moved into the bag first, so it stays alive."};

const ART={"0": {"before": [["Expression", "Code that produces a value, like 1 + 2."], ["Operator and operand", "In 1 + 2, the + is the operator. The 1 and the 2 are its operands."], ["Stack", "A pile of values where you only touch the top (last in, first out)."], ["Instruction", "One tiny command for the machine, like CONSTANT or ADD."], ["nil", "Means \"no value\"."]], "how": ["The compiler turns your text into a list of instructions (bytecode).", "A virtual machine runs the instructions one at a time.", "CONSTANT copies a fixed value from your code onto the stack.", "ADD removes the top two values, adds them and puts the result back.", "PRINT removes the top value and shows it.", "At the end the compiler adds NIL and RETURN. A program must give something back when it finishes, and nil means nothing."], "comp": ["Scanning: the text is cut into tokens: print, 1, +, 2 and ;", "Parsing: the compiler reads 1, then sees +, then reads 2. It knows + needs a value on each side.", "Emitting: it writes CONSTANT for 1, CONSTANT for 2, then ADD. The values come first because the machine can only add what is already on the stack. This order is called postfix.", "Precedence: in 1 + 2 * 3 the compiler emits MULTIPLY before ADD, so the multiplication runs first."], "key": ["The stack holds values while they wait.", "Operators work on the top values of the stack.", "The compiler decides the order of the instructions. The virtual machine only follows it."]}, "1": {"before": [["Variable", "A name that points to a value."], ["Global", "Declared outside any block. Kept in a table by name for the whole program."], ["Local", "Declared inside { }. Kept on the stack and removed at the closing }."], ["Scope", "The part of the code where a name can be used."]], "how": ["var at the top level makes a global. DEFINE_GLOBAL stores the value in a table under its name.", "Reading it later uses GET_GLOBAL with the name.", "var inside { } makes a local. Its value just stays on the stack. The compiler remembers which place on the stack it has.", "Reading a local uses GET_LOCAL with that place. The name is not needed while the program runs.", "At the closing }, POP removes the locals from the stack."], "comp": ["While it reads a block, the compiler keeps a list of the local names. The position in this list is the place on the stack.", "If a name is not in that list, it must be a global, so the compiler emits GET_GLOBAL.", "This is why b cannot be found after the }: the compiler already removed it from its list."], "key": ["Globals are found by name. Locals are found by place on the stack.", "Scope is decided by the compiler, before the program runs.", "Locals are faster, because no name lookup is needed."]}, "2": {"before": [["Condition", "An expression that is true or false."], ["Jump", "An instruction that moves to another instruction, instead of the next one."], ["Branch", "A place where the program can go two ways, like if and else."]], "how": ["JUMP_IF_FALSE looks at the top value. If it is false, it jumps ahead.", "JUMP always jumps ahead. After the if part runs, it skips the else part.", "LOOP jumps backward. This is how a loop repeats.", "A for loop works like a while loop, with a start and a step added by the compiler.", "Every jump has a target: the number of the instruction to go to."], "comp": ["When the compiler reads an if, it does not know where to jump yet. The code after it is not compiled yet.", "So it writes the jump with an empty target, compiles the body, then goes back and fills the target in. This is called backpatching.", "A loop jump goes backward, so its target is already known: the start of the condition."], "key": ["if, while and for all become jumps.", "Forward jumps skip code. Backward jumps repeat code.", "The compiler fills in the jump targets after it has compiled the body."]}, "3": {"before": [["Function", "A named block of code that you can run again and again."], ["Call", "Running a function. You pass it arguments."], ["Parameter and argument", "In fact(n), n is the parameter. The value you pass in is the argument."], ["Call stack", "The list of open function calls. Each call has its own window."]], "how": ["The body of the function is compiled once, into its own list of instructions.", "CALL opens a new window on the stack. The arguments become the local variables of that window.", "RETURN closes the window, removes its values and leaves the result on the stack.", "A function that calls itself (recursion) opens one window per call. Each window has its own copy of n.", "Only a limited number of windows can be open. If there are too many, you get a stack overflow."], "comp": ["The compiler compiles the function body separately, with its own list of locals. The parameters are the first locals.", "A call is compiled as: the function, then the arguments, then CALL with the number of arguments.", "The function name is stored in a global, so a call finds it with GET_GLOBAL."], "key": ["Every call has its own window and its own values.", "Recursion needs a base case. Without one the windows never stop.", "The call stack is a stack of windows."]}, "4": {"before": [["Closure", "A function together with the outside variables it uses."], ["Upvalue", "A variable from an outer function that an inner function uses."], ["Open and closed", "Open: the variable is still on the stack. Closed: its value was moved into the bag."]], "how": ["count uses i, which belongs to makeCounter. The compiler marks i as captured.", "When makeCounter creates count, CLOSURE gives count a bag that holds i.", "While makeCounter runs, the bag points to i on the stack. It is open.", "When makeCounter returns, its window disappears. Before that, the value of i is moved into the bag. It is closed now.", "Each call to count reads and changes i in the bag with GET_UPVALUE and SET_UPVALUE."], "comp": ["While compiling count, the compiler looks for i. It is not a local of count, so it searches the outer function.", "When it finds i there, it adds i to the upvalue list of count.", "At the end it emits CLOSURE with that list, so the machine knows what to put in the bag."], "key": ["A closure keeps variables alive after their function has ended.", "The value moves off the stack just before the window closes.", "Each call to makeCounter makes a new bag."]}, "5": {"before": [["Class", "A blueprint. It lists the methods that objects of this kind have."], ["Object", "A thing made from a class. It has its own fields."], ["Instance", "Another word for an object made from a class. Lox prints it like this: Animal instance."], ["Field", "A named value stored inside an object, like name."], ["Method", "A function that belongs to a class."], ["this", "Inside a method, the object the method was called on."]], "how": ["CLASS creates an empty class and stores it under its name, Animal.", "METHOD adds one function to the class for each method, here init and speak. Each one is stored once, in the class.", "Animal(\"Rex\") calls the class. The machine makes a new object and runs init on it.", "this.name = name stores a value in a field of that object (SET_PROPERTY).", "Animal(\"Tom\") makes a second object. It has its own name field and uses the same methods.", "a.speak() finds speak through the class and calls it. The object a becomes this inside the method.", "Inheritance: class Dog < Animal copies the methods of Animal into Dog (INHERIT). super.speak() calls the version from Animal."], "comp": ["Inside a method, the first place in the window holds this. The compiler gives that place the name this.", "When the compiler reads this, it treats it like a local variable.", "Animal(\"Rex\") is compiled as a normal CALL. The machine sees that the value is a class, so it makes an object.", "A call like a.speak() is compiled as INVOKE. It finds and calls the method in one step.", "For a subclass the compiler makes a hidden variable called super, so super.speak() knows where to look."], "key": ["A class is made once. Objects are made many times.", "Fields belong to each object. Methods are shared through the class.", "Changing a field of one object never changes another object.", "this is just the first local variable of a method."]}, "6": {"before": [["Heap", "The part of memory where objects live while the program runs."], ["Object", "Something stored in the heap, like a string, a function or an instance of a class."], ["Reference", "A way to find an object. A variable holds a reference, not the object itself."], ["Stack and heap", "Small values like numbers sit on the stack. Bigger things like text sit in the heap."], ["Cell", "One small slot of the heap. A short string takes 1 cell."]], "how": ["A number is small and always the same size. It fits directly on the stack.", "Text can be any length, and it can live longer than the code that made it. So text goes in the heap.", "When the program builds new text, the machine reserves space for it in the heap. This is called allocation.", "The stack or a variable keeps a reference to that space, not the text itself.", "Each new string is a new object. s = s + \"a\" makes a new string and leaves the old one behind.", "Nothing frees the old strings yet. They pile up as unused objects. The picture counts objects made, in use and unused.", "The heap has a limit. When it is full, the program stops with Out of memory."], "comp": ["The compiler does not touch the heap. It only emits instructions such as ADD.", "ADD sees two strings, so it builds a new string in the heap instead of adding numbers.", "The machine looks for an equal string first. Equal text is stored only once. This is called interning.", "A number never takes heap space. A loop that only adds numbers fills no cells.", "Closures, classes and objects are heap objects too.", "The grid is a simplified picture: a string takes one cell, plus one more for every 8 letters."], "key": ["Strings, functions, classes and objects live in the heap. Numbers do not.", "Unused objects pile up if nothing frees them.", "The heap is limited. This site draws it as a small grid so you can watch it fill up."]}, "7": {"before": [["Syntax error", "Code written in a way the language does not allow, like a missing ;."], ["Runtime error", "Code that is written correctly but cannot run, like adding a number to a text."], ["Compile time", "The time when the compiler reads your code, before it runs."]], "how": ["The compiler checks the grammar while it reads. If it finds a mistake, it reports it and nothing runs.", "If the code is fine, the virtual machine runs it. Mistakes that depend on values show up only now.", "x + \"a\" has correct grammar, but ADD cannot add a number and a text.", "The machine stops and reports the error with the line number."], "comp": ["The compiler cannot know what x will hold, because values exist only while the program runs.", "Real compilers such as clox keep checking after an error, so they can report more mistakes. This site shows only the first."], "key": ["Syntax errors are found before running. Runtime errors are found while running.", "After a syntax error nothing runs at all.", "A runtime error needs real values to be found."]}, "8": {"before": [["Garbage", "An object that the program can no longer reach."], ["Root", "A place the collector starts from: the stack and the global variables."], ["Reachable", "Can be found from a root by following references."], ["Mark and sweep", "First mark everything reachable. Then free everything that is not marked."]], "how": ["The heap has a limit. When a new object does not fit, the program pauses.", "The garbage collector starts from the roots: the stack and the global variables. In this program the roots hold s and keep.", "Mark: it follows every reference and marks each object it can reach.", "An object is garbage when nothing can reach it. Age does not matter. The old string held by keep stays.", "Sweep: every object that was not marked is freed. The program continues. The new object now fits.", "If the live objects alone fill the heap, you still get Out of memory."], "comp": ["The compiler and the instructions know nothing about garbage. Only the machine does.", "The collector runs inside an allocation, for example inside ADD when it builds a new string.", "While ADD builds the new string, both old strings stay on the stack. So the collector cannot free them by mistake.", "The Held by line in the picture shows which root leads to each object.", "Real collectors start when the heap passes a size limit. clox starts at about 1 MB. After each collection it sets the next limit to twice the memory still in use.", "This site uses a tiny heap so you can watch the collector work."], "key": ["A collector never asks what is garbage. It finds what is reachable and frees the rest.", "An object is garbage when nothing can reach it, not when it is old.", "The roots are the stack and the global variables.", "Collecting costs time, so real systems do it only when memory is getting full."]}, "9": {"before": [["Optimization", "Changing code so it does the same job with less work."], ["Constant folding", "Calculating an expression early, when all its values are already known."], ["Bytecode", "The list of instructions the compiler makes."]], "how": ["The optimizer reads the instructions after the compiler has made them.", "It looks for patterns it knows. For example CONSTANT, CONSTANT, MULTIPLY can become one CONSTANT with the result.", "The program gives the same answer with fewer steps.", "The optimizer must never change the answer. This site checks that on every run and falls back to the original if it ever differs."], "comp": ["It folds in pieces. 2 * 3 becomes 6. Then 6 * 4 becomes 24. And 5 * 6 becomes 30.", "Jumps need care. When instructions are removed, the jump targets must move too."], "key": ["Optimization changes how the work is done, not the result.", "Real compilers have hundreds of such tricks.", "Each trick is a pattern plus a safe replacement."]}};

 Q('After ADD finishes 1 + 2, what is left on the pile?',['Just 3','1 and 2','Nothing','1 and 3'],'ADD removes the top two values and puts their sum back.')],
1:[Q('What happens when this program runs?',['An error: b is not defined','It prints 20','It prints 10','It prints nil'],'b was made inside { } and thrown away at the closing }. Then print b cannot find it.','var a = 10;\n{\n  var b = a * 2;\n}\nprint b;'),
 Q('When is a variable made inside { } thrown away?',['At the closing }','When the program ends','Never','When you print it'],'The block ends at }. Its boxes go away there. This is called scope.'),
 Q('What does this program print?',['5','1','4','x'],'x starts at 1. Then x = x + 4 saves 5 back in the same box.','var x = 1;\nx = x + 4;\nprint x;')],
2:[Q('What does a loop do when it reaches the end of its body?',['Jumps back up and tests the condition again','Stops the program','Deletes its variables','Prints the answer'],'A loop is just a jump back up. It stops when the condition becomes false.'),
 Q('What does this program print?',['0','3','1','nil'],'n goes 3, 2, 1, 0. At 0 the condition n > 0 is false, so the loop stops.','var n = 3;\nwhile (n > 0) {\n  n = n - 1;\n}\nprint n;'),
 Q('A loop whose condition never becomes false...',['Never stops by itself','Stops after 10 times','Runs only once','Gives an error at once'],'It keeps jumping back. This page stops it after many steps so your browser is safe.')],
3:[Q('What does this program print?',['6','3','1','9'],'fact(3) is 3 * fact(2). That is 3 * 2 * fact(1). fact(1) is 1. So the answer is 6.','fun fact(n) {\n  if (n <= 1) return 1;\n  return n * fact(n - 1);\n}\nprint fact(3);'),
 Q('What is the call stack?',['The pile of windows for calls that are still waiting','A list of all variables','The screen','A kind of loop'],'Each call gets its own window with its own values. Calls that wait sit in the stack.'),
 Q('What stops fact from calling itself for ever?',['The if line that returns 1','The print line','The variable n','Nothing. It just ends'],'That line is the base case. Without it the windows pile up until the stack overflows.')],
4:[Q('What is a closure?',['A function plus the variables it remembers','A loop that repeats','An error message','A kind of number'],'A closure carries the variables it uses, even after the outer function has finished.'),
 Q('What does this program print?',['2','1','0','nil'],'c() was called twice. The same i is kept in the closure, so it counts 1 then 2.','fun makeCounter() {\n  var i = 0;\n  fun count() {\n    i = i + 1;\n    return i;\n  }\n  return count;\n}\nvar c = makeCounter();\nc();\nprint c();'),
 Q('makeCounter has finished. Why does count still know i?',['i moved into a backpack that count keeps','i is a global variable','The computer guesses','It does not know i'],'When the desk is cleared, a captured variable is moved to a backpack (an upvalue) on the heap.')],
6:[Q('Why does text live on the heap and not on the pile?',['Text can be any length, so it needs a room of its own','Text is faster there','The pile cannot hold letters','It is a rule of print'],'Numbers are small and fixed. Text can grow, so it gets a cell on the heap.'),
 Q('What does s = s + "a" do to memory?',['Builds a new piece of text in a new cell','Changes the old text in place','Deletes s','Nothing'],'Text is never changed in place. Every + builds a new piece, and the old one is left behind.'),
 Q('A variable that holds text is like...',['An arrow pointing at a cell','A copy of the cell','The cell itself','The whole heap'],'The variable stores where the text lives. Cut the arrow and nothing points at the text any more.')],
7:[Q('What kind of mistake is this?',['One found before the program runs','One found while it runs','Not a mistake','A memory mistake'],'The code does not follow the rules of the language. The compiler stops it before anything runs.','print 1 +;'),
 Q('When does the computer notice the mistake in this program?',['While running, when it reaches print b','Before running','Never','When you save'],'The code is valid, but b was never made. The error appears only when that line runs.','var a = 1;\nprint b;'),
 Q('What should you do first when you see an error message?',['Read the line number and the message','Delete the program','Restart the computer','Ignore it'],'The message names the line and the problem. Start there.')],
8:[Q('What is garbage in a program?',['Data that nothing can reach any more','Data that is old','Data that is big','Data that was printed'],'Age and size do not matter. Garbage means no variable can reach it.'),
 Q('Which cells does the collector mark?',['The ones reachable from variables','The first ones made','The biggest ones','Random ones'],'It follows every arrow that starts at a variable and ticks each cell it reaches.'),
 Q('What does the sweep step do?',['Frees every cell that was not marked','Frees every cell','Marks the cells','Prints the cells'],'Marked cells are still in use. Everything else is garbage and is freed.')],
9:[Q('What can an optimizer do before the program runs?',['Work out 26 once so it is not worked out again','Change the answer','Skip the print','Rename the variables'],'2 * 3 + 4 * 5 uses only fixed numbers, so the answer can be found early.','print 2 * 3 + 4 * 5;'),
 Q('An optimization must never...',['Change what the program prints','Use fewer steps','Be tested','Run quickly'],'The program must give the same answer. Only the work changes.'),
 Q('What is constant folding?',['Doing sums of fixed numbers once, early','Folding the file in half','Deleting constants','Making a loop'],'The sum is done by the compiler. The machine just uses the result.')]};
